name: 'Coverage'
description: 'Coverage'

runs:
  using: composite
  steps:
    - name: Setup
      uses: ./tooling/github/setup

    - name: Configure Turborepo Caching
      uses: rharkor/caching-for-turbo@v2.3.11
      with:
        cache-prefix: coverage_

    - name: Cache MongoDB binaries
      uses: actions/cache@v4
      with:
        path: ~/.cache/mongodb-binaries
        key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          mongodb-binaries-${{ runner.os }}-

    - name: Coverage
      shell: bash
      run: pnpm coverage

    - name: Upload to Codecov (utils)
      uses: codecov/codecov-action@v5
      with:
        directory: ./packages/utils/coverage
        fail_ci_if_error: false
        flags: utils

    - name: Upload to Codecov (auth)
      uses: codecov/codecov-action@v5
      with:
        directory: ./packages/auth/coverage
        fail_ci_if_error: false
        flags: auth

    - name: Upload to Codecov (logger)
      uses: codecov/codecov-action@v5
      with:
        directory: ./packages/logger/coverage
        fail_ci_if_error: false
        flags: logger

    - name: Upload to Codecov (web)
      uses: codecov/codecov-action@v5
      with:
        directory: ./apps/web/coverage
        fail_ci_if_error: false
        flags: web
